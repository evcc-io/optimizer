version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    # one PR a month for minor and patch bumps, majors come on their own
    groups:
      python:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    # 0 disables version-update PRs; the entry still enables security updates
    open-pull-requests-limit: 0
