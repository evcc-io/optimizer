name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false
        default: latest
      restrict_ingress:
        description: Restrict Container Apps ingress to the VM floor (after DNS points at the load balancer)
        type: boolean
        default: false

env:
  IMAGE: evcc/optimizer
  RESOURCE_GROUP: rg-optimizer-prod

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify image provides linux/amd64 and linux/arm64
        run: |
          image="${{ env.IMAGE }}:${{ inputs.image_tag || 'latest' }}"
          # multi-platform tags publish an index; single-platform tags publish a
          # bare manifest, for which the index template fails and we fall back
          platforms=$(docker buildx imagetools inspect "$image" \
              --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' 2>/dev/null) \
            || platforms=$(docker buildx imagetools inspect "$image" \
              --format '{{.Image.OS}}/{{.Image.Architecture}}')
          echo "$image provides: $platforms"
          # Container Apps nodes are amd64, the VM floor is arm64; a tag missing either would
          # fail with ImagePullBackOff on one side. Publish via the 'Publish Docker' workflow.
          for arch in linux/amd64 linux/arm64; do
            case " $platforms " in
              *" $arch "*) ;;
              *)
                echo "::error::$image has no $arch manifest. Publish via the 'Publish Docker' workflow instead of pushing by hand."
                exit 1
                ;;
            esac
          done

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters \
                containerImage=${{ env.IMAGE }}:${{ inputs.image_tag || 'latest' }} \
                vmSshPublicKey="${{ secrets.VM_SSH_PUBLIC_KEY }}" \
                restrictIngressToVms=${{ inputs.restrict_ingress }}

      # Bicep only moves the VM tag; the running container is swapped here, one VM after the
      # other. update.sh drains HAProxy first so in-flight solves finish and new requests spill
      # to Container Apps while the container restarts.
      - name: Roll the VM floor
        uses: azure/cli@v2
        with:
          inlineScript: |
            image="${{ env.IMAGE }}:${{ inputs.image_tag || 'latest' }}"
            for vm in $(az vm list -g ${{ env.RESOURCE_GROUP }} --query "[?tags.role=='optimizer'].name" -o tsv); do
              echo "::group::$vm"
              az vm run-command invoke -g ${{ env.RESOURCE_GROUP }} -n "$vm" \
                --command-id RunShellScript --scripts "/opt/optimizer/update.sh $image" \
                --query "value[0].message" -o tsv
              echo "::endgroup::"
            done
