name: Model issue
description: The optimizer returns a wrong plan for a given request, or the model lacks a capability

body:
  - type: markdown
    attributes:
      value: |
        This repository is about the optimization model only: for a given request, which plan does the optimizer return?

        evcc decides when the optimizer is invoked, which devices it sends and how, and with which data. Report everything that depends on this in the [evcc repository][evcc], for example:

        - wrong or missing values in the request (forecasts, prices, battery SoC, limits, `p_a`, goals)
        - household demand `gt` that is too high or too low, or contains loads it should not, e.g. a heating rod or heat pump running on PV surplus only
        - devices modelled the wrong way, e.g. a flexible load sent as fixed demand, or batteries, vehicles or charging points missing from the request
        - evcc not following the returned plan, battery modes, charging behaviour
        - UI, configuration and devices

        Rule of thumb: if the plan would be right for the request as sent, the problem is in evcc. If you are unsure, start in the evcc repository. Issues not about the model will be closed.

        [evcc]: https://github.com/evcc-io/evcc/issues
  - type: checkboxes
    id: model
    attributes:
      label: Scope
      options:
        - label: I have checked that the request is correct, i.e. every value and device in it matches my setup, and the plan is wrong for this request or the model lacks a capability.
          required: true
  - type: textarea
    validations:
      required: true
    attributes:
      label: Describe the problem
      description: >-
        What the optimizer plans, and what you expected instead and why. For a missing capability, describe what the model should support.
  - type: textarea
    attributes:
      label: Request
      render: json
      description: >-
        The request JSON sent to the optimizer. Required for a wrong plan, so the result can be reproduced.
  - type: textarea
    attributes:
      label: Response or plan
      description: >-
        The response JSON or a screenshot of the plan, with the time steps that look wrong.
