# HAProxy on each VM: TLS, local gunicorn workers first, Container Apps when they are busy or down.
# __PLACEHOLDERS__ are filled by main.bicep before the file lands in cloud-init.
global
    log stdout format raw local0
    maxconn 2000
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    # gunicorn --timeout 60 bounds a solve, these sit just above it
    timeout client 70s
    timeout server 70s
    # a request waits this long for a local worker before the frontend ACL has already sent it to overflow
    timeout queue 2s

frontend http
    bind :80
    acl acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless acme
    use_backend acme if acme

frontend https
    bind :443 ssl crt /certs/ alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    # one gunicorn worker per vCPU: at __WORKERS__ in-flight requests every local core is solving
    acl local_full be_conn(local) ge __WORKERS__
    # drained (deploy) or dead (container restart) local workers
    acl local_down nbsrv(local) eq 0
    use_backend overflow if local_full || local_down
    default_backend local

backend local
    server workers 127.0.0.1:7050 maxconn __WORKERS__ check inter 2s fall 2 rise 1

backend overflow
    # no health check: a probe would wake Container Apps from zero and keep a replica billed
    http-request set-header Host __ACA_FQDN__
    server aca __ACA_FQDN__:443 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str(__ACA_FQDN__)

backend acme
    # certbot --standalone on the acme owner answers HTTP-01 for every VM behind the load balancer
    server owner __ACME_OWNER_IP__:8402
